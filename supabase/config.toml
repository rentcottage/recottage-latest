# Per-function deploy settings.
# Functions reachable from anonymous (not signed-in) visitors must skip the JWT
# enforcement, otherwise Supabase rejects the request with INVALID_JWT_FORMAT
# when the frontend sends the new `sb_publishable_*` key as a bearer token.

[functions.corporate-application-handler]
verify_jwt = false

[functions.property-application-handler]
verify_jwt = false

# Called from the signup form before the visitor has a session.
[functions.phone-otp]
verify_jwt = false

# Receives anonymous BOG payment callbacks + verify/mark-failed from redirect pages.
[functions.bog-payment]
verify_jwt = false

# NOTE: currently public to preserve the signup email-block check (checkEmailBlocked,
# which calls it unauthenticated). SECURITY TODO: this exposes fetch-users (all PII)
# and delete-user/block-email to anyone. Needs in-function admin authorization
# (verify caller's session JWT + profiles.role='admin') before it can be locked down.
[functions.admin-user-management]
verify_jwt = false

# Called only by the admin panel, which sends the `sb_publishable_*` key as its
# bearer token — not a JWT, so gateway verification would reject it with
# INVALID_JWT_FORMAT. Every action inside self-authorizes against the
# server-side ADMIN_PANEL_PASSWORD secret before doing anything.
[functions.admin-host-actions]
verify_jwt = false

# Called only by the admin panel (sends the anon key as bearer, which is not a
# user session). Authorizes in code against ADMIN_PANEL_PASSWORD via the
# `x-admin-password` header — see resend-approval-email/handler.ts. Listed
# explicitly because production runs with verification off; the default (true)
# would change behaviour on a CLI deploy.
[functions.resend-approval-email]
verify_jwt = false

# Authorizes every action in code (see booking-handler/handler.ts):
#   admin-*                        → `x-admin-password` (ADMIN_PANEL_PASSWORD)
#   host-* / cancel / change-dates → user session JWT, verified with
#                                    auth.getUser(), plus property/booking ownership
#   expire-pending-approvals,
#   send-contact-reveal-emails     → `x-cron-secret` (CRON_SECRET)
# Gateway verification stays off: the admin panel authenticates with the admin
# password rather than a user JWT, and scheduler calls use the cron secret.
# The old anonymous GET email links and implicit booking creation are removed.
[functions.booking-handler]
verify_jwt = false

# Invoked only by Supabase Cron. Authorizes in code: POST with `x-cron-secret`
# matching CRON_SECRET (see booking-reminders/handler.ts); every other caller
# gets 401/405. Gateway verification stays off because the scheduler does not
# send a user JWT.
[functions.booking-reminders]
verify_jwt = false

# Host calendar import/export. POST actions authorize in code with the user's
# verified session (auth.getUser) plus property/calendar ownership; the gateway
# check stays on as an additional layer (the anon key alone passes it, so it is
# not relied on). The former GET export was removed; OTAs use ical-export.
[functions.ical-sync]
verify_jwt = true

# Public OTA availability feed. Airbnb/Booking.com cannot send Authorization
# headers, so gateway JWT verification is off; the function itself requires a
# per-property secret token in the path (/ical-export/<token>.ics) and returns
# an identical 404 for anything else.
[functions.ical-export]
verify_jwt = false

# Read-only admin data (status logs). The admin dashboard has no Supabase
# session; access is gated in code by x-admin-password (SHA-256 + constant-time
# compare against ADMIN_PANEL_PASSWORD). See admin-read/handler.ts.
[functions.admin-read]
verify_jwt = false

# Called only by the n8n Cloud automations, which hold no Supabase session and
# no database credential: the `x-n8n-secret` header (compared against
# N8N_DATA_SECRET) is the gate. See n8n-data/handler.ts.
[functions.n8n-data]
verify_jwt = false
