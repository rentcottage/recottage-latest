# Per-function deploy settings.
# Functions reachable from anonymous (not signed-in) visitors must skip the JWT
# enforcement, otherwise Supabase rejects the request with INVALID_JWT_FORMAT
# when the frontend sends the new `sb_publishable_*` key as a bearer token.

[functions.corporate-application-handler]
verify_jwt = false

[functions.property-application-handler]
verify_jwt = false

# Called from the signup form before the visitor has a session.
[functions.phone-otp]
verify_jwt = false

# Receives anonymous BOG payment callbacks + verify/mark-failed from redirect pages.
[functions.bog-payment]
verify_jwt = false

# NOTE: currently public to preserve the signup email-block check (checkEmailBlocked,
# which calls it unauthenticated). SECURITY TODO: this exposes fetch-users (all PII)
# and delete-user/block-email to anyone. Needs in-function admin authorization
# (verify caller's session JWT + profiles.role='admin') before it can be locked down.
[functions.admin-user-management]
verify_jwt = false

# Serves anonymous email one-click links (approve/reject/confirm) AND the host &
# admin dashboards, which send no user JWT — the host dashboard sends no auth
# header and the admin panel sends the `sb_publishable_*` key. With the default
# verify_jwt=true the gateway rejected both (missing / INVALID_JWT_FORMAT), so
# host- and admin-side booking rejection failed identically. Host actions
# self-authorize via a property-ownership check; admin actions still inherit the
# shared anon-key posture of the other admin-* functions (not yet gated).
[functions.booking-handler]
verify_jwt = false
